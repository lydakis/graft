name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3
      # Copies of a plain folder clone its files, which ext4 can't: the tests' temporary
      # folders go on a small btrfs disk.
      - name: Make a disk that clones files
        run: |
          sudo apt-get install -y btrfs-progs
          truncate -s 1G "$RUNNER_TEMP/clones.img"
          mkfs.btrfs -q "$RUNNER_TEMP/clones.img"
          sudo mkdir /mnt/clones
          sudo mount -o loop "$RUNNER_TEMP/clones.img" /mnt/clones
          sudo chown "$(id -u):$(id -g)" /mnt/clones
      - name: Run tests
        run: cargo test
        env:
          GRAFT_REQUIRE_MOUNT: "1"
          TMPDIR: /mnt/clones

  # macOS mounts over NFS to localhost, which the runner allows without setup; its
  # APFS disk clones files, so the plain-folder test runs too.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test
        env:
          GRAFT_REQUIRE_MOUNT: "1"
