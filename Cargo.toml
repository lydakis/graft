[package]
name = "graft"
version = "0.2.0"
edition = "2024"
description = "Work in fast copies of a git repository that share its files, fetched as read, built on sandfs; each copy lands as a branch, and on GitHub or GitLab as a pull or merge request"
license = "MIT"
repository = "https://github.com/lydakis/graft"
publish = false
default-run = "gft"

[[bin]]
name = "gft"
path = "src/bin/gft.rs"

[[bin]]
name = "graft"
path = "src/bin/graft.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
sandfs = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
